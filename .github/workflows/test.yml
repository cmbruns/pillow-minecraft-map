name: Run Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [
          "macos-latest",
          "ubuntu-latest",
        ]
        # Monitor upstream PIL supported versions at
        # https://github.com/python-pillow/Pillow/blob/main/.github/workflows/test.yml
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # Caching dependencies speeds up your subsequent workflow runs
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow
        # If your plugin requires installation to register, uncomment below:
        # pip install -e .
        pip install .[test]

    - name: Run tests with pytest
      run: |
        pytest
